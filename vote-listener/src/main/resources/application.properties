# --- Kafka ---
spring.kafka.consumer.group-id=vote-listener
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.votingbooth.votemodule.votelistener.model
spring.kafka.consumer.properties.spring.json.value.default.type=com.votingbooth.votemodule.votelistener.model.VoteEvent
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.listener.concurrency=1

spring.jackson.property-naming-strategy=SNAKE_CASE